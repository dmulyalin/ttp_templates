- name: CUSTOMER_A
  instance_type: vrf
  description: Customer A VRF
  rd: 65000:100
  interfaces:
  - Vlan100
  address_families:
    ipv4:
      rt_import:
      - 65000:100
      rt_export:
      - 65000:100
      route_policy_import: IMPORT-CUSTOMER-A
      route_policy_export: EXPORT-CUSTOMER-A
    ipv6:
      rt_import:
      - 65000:106
      rt_export:
      - 65000:106
      route_policy_import: IMPORT-CUSTOMER-A-V6
      route_policy_export: EXPORT-CUSTOMER-A-V6
